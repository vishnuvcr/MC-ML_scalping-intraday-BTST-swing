name: Phase 10 Global Market Inefficiency

concurrency:
  group: phase10-global-market-inefficiency-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [phase-10-global-market-inefficiency]
  workflow_dispatch:
    inputs:
      mode:
        description: "Run pilot only or join a Phase 9 trade panel"
        required: true
        default: "pilot"
        type: choice
        options:
          - pilot
          - oos
      refresh_data:
        description: "Refresh Yahoo/yfinance global data instead of using runner cache"
        required: true
        default: false
        type: boolean
jobs:
  phase10:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: .cache/phase10-global
          key: phase10-global-v1-\${{ hashFiles('config/phase10_global_tickers.txt') }}

      - name: Install dependencies
        run: pip install -U yfinance pandas numpy
