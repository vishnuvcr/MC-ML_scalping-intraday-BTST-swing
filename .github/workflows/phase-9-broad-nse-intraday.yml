name: Phase 9 Broad NSE 1-Minute Intraday

concurrency:
  group: phase9-broad-minute-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [phase-9-universe-selection-regime]
  workflow_dispatch:

jobs:
  broad_minute:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: .cache/phase9_fullminute
          key: phase9-broad-minute-cache-v1
      - name: Install dependencies
        run: pip install -U numpy pandas pyarrow statsmodels scipy huggingface_hub
      - name: Compile and smoke-test
        run: |
          python -m py_compile scripts/phase9_fast_daily.py scripts/phase9_universe_regime_analysis.py scripts/phase9_full_nse_intraday.py
          python - <<'PY'
          import pandas as pd, numpy as np
          from scripts.phase9_fast_daily import ema, atr, mc_gate
          x=pd.DataFrame({'open':np.arange(50,dtype=float)+100,'high':np.arange(50,dtype=float)+101,'low':np.arange(50,dtype=float)+99,'close':np.arange(50,dtype=float)+100,'volume':np.ones(50)})
          assert np.isfinite(ema(x.close,20).iloc[-1])
          assert np.isfinite(atr(x,14).iloc[-1])
          assert isinstance(mc_gate([0.01]*20,123),bool)
          print('phase9 smoke test passed')
          PY
      - name: Run broad 1-minute to 15-minute analysis
        run: python scripts/phase9_full_nse_intraday.py --out research_results/phase9_full_nse_intraday
      - name: Upload derived results only
        uses: actions/upload-artifact@v4
        with:
          name: phase9-broad-nse-intraday
          path: research_results/phase9_full_nse_intraday